<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_5 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Atmospheric 3D WebGL Particle Wave Grid in Electric Cobalt (#2D68FF) on Obsidian Black
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2') || document.body;
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 1000);
  camera.position.set(0, 18, 38);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  container.appendChild(renderer.domElement);

  // High-density grid dimensions
  const cols = 90;
  const rows = 90;
  const numParticles = cols * rows;
  const separation = 1.3;

  const positions = new Float32Array(numParticles * 3);
  const scales = new Float32Array(numParticles);
  const baseColors = new Float32Array(numParticles * 3);

  let i = 0, j = 0;
  for (let ix = 0; ix < cols; ix++) {
    for (let iy = 0; iy < rows; iy++) {
      const x = (ix - cols / 2) * separation;
      const z = (iy - rows / 2) * separation;
      const y = 0;

      positions[i] = x;
      positions[i + 1] = y;
      positions[i + 2] = z;

      // Subtle scale variation with center emphasis
      const distFromCenter = Math.sqrt(x * x + z * z);
      scales[j] = Math.max(0.6, 2.2 - (distFromCenter * 0.025));

      // Dual electric cobalt and neon cyan tones
      const mixRatio = Math.sin(ix * 0.08) * 0.5 + 0.5;
      baseColors[i] = 0.17 * mixRatio + 0.05 * (1 - mixRatio);      // R: #2D68FF / #0df
      baseColors[i + 1] = 0.41 * mixRatio + 0.72 * (1 - mixRatio);  // G
      baseColors[i + 2] = 1.0 * mixRatio + 0.95 * (1 - mixRatio);   // B

      i += 3;
      j++;
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('scale', new THREE.BufferAttribute(scales, 1));
  geometry.setAttribute('color', new THREE.BufferAttribute(baseColors, 3));

  // Custom particle sprite shader material for smooth anti-aliased glowing dots
  const vertexShader = `
    attribute float scale;
    attribute vec3 color;
    varying vec3 vColor;
    varying float vHeight;

    void main() {
      vColor = color;
      vHeight = position.y;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = scale * (180.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `;

  const fragmentShader = `
    varying vec3 vColor;
    varying float vHeight;

    void main() {
      // Soft radial circular particle falloff
      vec2 coord = gl_PointCoord - vec2(0.5);
      float dist = length(coord);
      if (dist > 0.5) discard;
      float strength = smoothstep(0.5, 0.05, dist);

      // Height luminosity boost (peaks shine brighter)
      float brightness = 0.8 + clamp(vHeight * 0.2, -0.2, 0.6);
      gl_FragColor = vec4(vColor * brightness, strength * 0.85);
    }
  `;

  const material = new THREE.ShaderMaterial({
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const particleSystem = new THREE.Points(geometry, material);
  scene.add(particleSystem);

  // Mouse interaction state
  let targetRotX = 0.35;
  let targetRotY = 0;
  let mouseX = 0;
  let mouseY = 0;

  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    targetRotY = mouseX * 0.15;
    targetRotX = 0.35 - mouseY * 0.1;
  });

  window.addEventListener('resize', () => {
    const newW = container.clientWidth || window.innerWidth;
    const newH = container.clientHeight || window.innerHeight;
    camera.aspect = newW / newH;
    camera.updateProjectionMatrix();
    renderer.setSize(newW, newH);
  });

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime() * 1.35;
    const positionAttr = geometry.attributes.position;
    const array = positionAttr.array;

    let idx = 0;
    for (let ix = 0; ix < cols; ix++) {
      for (let iy = 0; iy < rows; iy++) {
        // Multi-frequency harmonic wave formulation for silky organic undulating cloth
        const wave1 = Math.sin(ix * 0.18 + time) * 2.8;
        const wave2 = Math.cos(iy * 0.16 + time * 0.9) * 2.5;
        const wave3 = Math.sin((ix + iy) * 0.11 + time * 1.4) * 1.8;
        const ripple = Math.sin(Math.sqrt((ix - cols / 2) ** 2 + (iy - rows / 2) ** 2) * 0.22 - time * 1.6) * 1.2;

        array[idx + 1] = wave1 + wave2 + wave3 + ripple;
        idx += 3;
      }
    }
    positionAttr.needsUpdate = true;

    // Smooth inertia camera tilt with mouse
    particleSystem.rotation.y += (targetRotY - particleSystem.rotation.y) * 0.04;
    particleSystem.rotation.x += (targetRotX - particleSystem.rotation.x) * 0.04;

    renderer.render(scene, camera);
  }

  animate();
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_5 -->
</body>
</html>
